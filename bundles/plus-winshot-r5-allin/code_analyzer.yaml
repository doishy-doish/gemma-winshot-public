# Read-only analyzer subagent (no skills vendored; read + graph tools only). Same base model per single-model rule.
name: code_analyzer
model: gemma-4-31b-it-qat-w4a16-ct
description: Read-only navigator + diff overspray reviewer. Give it identifiers or a git diff; it returns LOCATION, FIX PLAN, TESTS or an overspray cut-list. Call before editing and before submitting.
instruction: !include prompts/analyzer.md
tools:
  - read_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config: !include configs/analyzer_sampling.yaml
